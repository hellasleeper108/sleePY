# Render Blueprint for PyQuest
# This file defines all services for one-click deployment to Render.com

services:
  # Backend (FastAPI)
  - type: web
    name: pyquest-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free  # Change to 'starter' or higher for production
    region: oregon  # Choose closest region
    branch: main
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pyquest-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: APP_NAME
        value: PyQuest
      - key: APP_VERSION
        value: 1.0.0
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'  # Update with your frontend URL in production
      # Optional AI Providers
      - key: OPENAI_API_KEY
        sync: false  # Set manually in dashboard
      - key: ANTHROPIC_API_KEY
        sync: false  # Set manually in dashboard
      - key: OLLAMA_BASE_URL
        value: http://host.docker.internal:11434

databases:
  # PostgreSQL Database
  - name: pyquest-db
    databaseName: pyquest
    user: pyquest
    plan: free  # Change to 'starter' or higher for production
    region: oregon  # Same region as backend
    postgresMajorVersion: 15
